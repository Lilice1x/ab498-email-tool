        function findLegislator() {
            const zipCode = document.getElementById("zip").value.trim();
            const fullName = document.getElementById("name").value.trim();
            const legislatorEmail = legislatorData[zipCode];

            if (legislatorEmail && fullName) {
                const subject = encodeURIComponent("Support AB596");
                const body = encodeURIComponent(`Dear Assemblymember,
                
                I’m writing to ask for your support on AB 596 to fund the Collective Bargaining Agreement for Unit I. This agreement was awarded through arbitration and reflects what we’ve earned through years of underpaid, essential service.

We need this bill funded. Many of us contribute 30% or more of our income to PERS, leaving take-home pay that often doesn’t match the demands of the job. We work in high-risk environments, shoulder enormous responsibility, and are expected to remain resilient no matter the cost. Without fair compensation, we lose good people. The state spends far more in turnover, training, and vacancies than it would by honoring this contract.

I voted for you because I believed you’d stand with working Nevadans, especially those on the frontlines. I hope you’ll show that now by voting yes on this bill.

Thank you for your time, and I sincerely hope we can count on your support.


Sincerely,
[fullName]`.replace(/\[fullName\]/g, fullName));
                const mailtoLink = `mailto:${legislatorEmail}?subject=${subject}&body=${body}`;
                
                document.getElementById("result").innerHTML = 
                    `<a href="${mailtoLink}" target="_blank" class="email-button">📨 Send Email to Your Legislator</a>`;
            } else {
                document.getElementById("result").innerHTML = "⚠️ Please enter your full name and a valid zip code.";
            }
        }
